<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="tx" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="0.5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="260" rx="18" fill="url(#bg)"/>
  <g opacity="0.25">
    <circle cx="120" cy="60" r="70" fill="#22d3ee"><animate attributeName="cy" values="60;90;60" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="200" r="90" fill="#8b5cf6"><animate attributeName="cy" values="200;165;200" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="800" cy="50" r="40" fill="#e879f9"><animate attributeName="cx" values="800;840;800" dur="5s" repeatCount="indefinite"/></circle>
  </g>
  <text x="500" y="38" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="15" fill="#475569">&lt;/&gt; hello, world — I'm</text>
  <text x="500" y="115" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="64" font-weight="800" fill="url(#tx)">Abhigyan Jaiswal</text>
  <g font-family="Consolas,Menlo,monospace" font-size="24" fill="#1e293b" text-anchor="middle">
    <text x="500" y="170" opacity="0">Full-Stack Developer ⚡
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.29;0.33;1" dur="9s" repeatCount="indefinite"/></text>
    <text x="500" y="170" opacity="0">Next.js · React · Node.js · AWS
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.29;0.33;1" dur="9s" begin="3s" repeatCount="indefinite"/></text>
    <text x="500" y="170" opacity="0">LeetCode 1785 · 500+ problems 🏆
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.29;0.33;1" dur="9s" begin="6s" repeatCount="indefinite"/></text>
  </g>
  <rect x="340" y="205" width="320" height="4" rx="2" fill="url(#tx)">
    <animate attributeName="width" values="40;320;40" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x" values="480;340;480" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text x="500" y="240" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#475569">B.Tech CSE (AI-ML) · Building scalable web &amp; AI products</text>
</svg>
